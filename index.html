<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>薪資計算器</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    background: #f5f1eb;
    color: #333;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 18px 14px 40px;
}

h1 {
    text-align: center;
    margin: 8px 0 20px;
    font-size: 28px;
    color: #5b4636;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #5b4636;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8cec3;
    border-radius: 10px;
    font-size: 17px;
    background: #fffdfb;
}

.row {
    display: flex;
    gap: 10px;
}

.row > div {
    flex: 1;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    width: 100%;
    margin-top: 18px;
    background: #7b5e48;
    color: white;
}

.primary:active {
    transform: scale(0.98);
}

.settle {
    width: 100%;
    margin-top: 10px;
    background: #d49a55;
    color: white;
}

.summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.summaryBox {
    background: #f7f2ec;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}

.summaryTitle {
    font-size: 14px;
    color: #777;
}

.summaryValue {
    margin-top: 5px;
    font-size: 20px;
    font-weight: bold;
    color: #5b4636;
}

.record {
    border: 1px solid #e1d8cf;
    border-radius: 13px;
    padding: 13px;
    margin-top: 10px;
    background: #fffdfa;
}

.recordHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.recordDate {
    font-weight: bold;
    color: #5b4636;
}

.deleteBtn {
    background: #eee;
    color: #c0392b;
    padding: 7px 10px;
    font-size: 14px;
}

.month {
    border: 1px solid #ded4ca;
    border-radius: 15px;
    padding: 15px;
    margin-top: 12px;
    background: white;
}

.monthHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.monthTitle {
    font-size: 19px;
    font-weight: bold;
    color: #5b4636;
}

.deleteMonthBtn {
    background: #f1eeee;
    color: #c0392b;
    padding: 8px 10px;
    font-size: 14px;
}

.monthInfo {
    margin-top: 12px;
    line-height: 1.8;
}

.empty {
    text-align: center;
    color: #888;
    padding: 20px 5px;
}

hr {
    border: 0;
    border-top: 1px solid #eee;
    margin: 15px 0;
}

.notice {
    background: #fff6df;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    color: #775b2e;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <h1>💰 薪資計算器</h1>

    <!-- 輸入區 -->
    <div class="card">

        <label for="hourlyRate">時薪</label>
        <input
            id="hourlyRate"
            type="number"
            min="0"
            step="1"
            placeholder="例如：200"
        >

        <label for="workDate">日期</label>
        <input id="workDate" type="date">

        <div class="row">
            <div>
                <label for="startTime">上班時間</label>
                <input id="startTime" type="time">
            </div>

            <div>
                <label for="endTime">下班時間</label>
                <input id="endTime" type="time">
            </div>
        </div>

        <div class="summary">

            <div class="summaryBox">
                <div class="summaryTitle">工作時間</div>
                <div class="summaryValue" id="workHours">0 小時 0 分</div>
            </div>

            <div class="summaryBox">
                <div class="summaryTitle">本筆薪資</div>
                <div class="summaryValue" id="workPay">$0</div>
            </div>

        </div>

        <label for="actualPay">實收金額</label>
        <input
            id="actualPay"
            type="number"
            min="0"
            step="1"
            placeholder="可自行輸入實際收到的金額"
        >

        <button class="primary" onclick="addRecord()">
            ＋ 新增這筆
        </button>

        <button class="settle" onclick="settleCurrentMonth()">
            ✅ 手動結算本月
        </button>

        <div class="notice">
            資料會自動儲存在這台手機的瀏覽器中。
        </div>

    </div>


    <!-- 本月資料 -->
    <div class="card">

        <h2>📊 本月統計</h2>

        <div class="summary">

            <div class="summaryBox">
                <div class="summaryTitle">累計工時</div>
                <div class="summaryValue" id="monthHours">
                    0 小時 0 分
                </div>
            </div>

            <div class="summaryBox">
                <div class="summaryTitle">應得薪資</div>
                <div class="summaryValue" id="monthPay">
                    $0
                </div>
            </div>

            <div class="summaryBox">
                <div class="summaryTitle">實收金額</div>
                <div class="summaryValue" id="monthActual">
                    $0
                </div>
            </div>

            <div class="summaryBox">
                <div class="summaryTitle">筆數</div>
                <div class="summaryValue" id="monthCount">
                    0
                </div>
            </div>

        </div>

        <div id="currentRecords"></div>

    </div>


    <!-- 每月紀錄 -->
    <div class="card">

        <h2>📅 每月結算紀錄</h2>

        <div id="monthlyRecords"></div>

    </div>

</div>


<script>

/* =========================
   資料儲存
========================= */

const STORAGE_KEY = "salaryCalculatorData";

let data = loadData();


function loadData() {

    try {

        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return {
                records: [],
                settlements: []
            };
        }

        const parsed = JSON.parse(saved);

        return {
            records: Array.isArray(parsed.records)
                ? parsed.records
                : [],

            settlements: Array.isArray(parsed.settlements)
                ? parsed.settlements
                : []
        };

    } catch (error) {

        console.error("讀取資料失敗", error);

        return {
            records: [],
            settlements: []
        };
    }
}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================
   預設日期
========================= */

function setDefaultDate() {

    const dateInput =
        document.getElementById("workDate");

    if (!dateInput.value) {

        const today = new Date();

        const yyyy = today.getFullYear();

        const mm = String(
            today.getMonth() + 1
        ).padStart(2, "0");

        const dd = String(
            today.getDate()
        ).padStart(2, "0");

        dateInput.value =
            `${yyyy}-${mm}-${dd}`;
    }
}


/* =========================
   計算工作時間
========================= */

function calculateMinutes() {

    const start =
        document.getElementById("startTime").value;

    const end =
        document.getElementById("endTime").value;

    if (!start || !end) {
        return 0;
    }

    const [startH, startM] =
        start.split(":").map(Number);

    const [endH, endM] =
        end.split(":").map(Number);

    let startMinutes =
        startH * 60 + startM;

    let endMinutes =
        endH * 60 + endM;

    /*
       如果下班時間比上班時間早，
       自動視為跨午夜。
    */

    if (endMinutes < startMinutes) {
        endMinutes += 24 * 60;
    }

    return endMinutes - startMinutes;
}


function formatMinutes(totalMinutes) {

    const hours =
        Math.floor(totalMinutes / 60);

    const minutes =
        totalMinutes % 60;

    return `${hours} 小時 ${minutes} 分`;
}


function calculatePay() {

    const hourlyRate =
        Number(
            document.getElementById("hourlyRate").value
        ) || 0;

    const minutes =
        calculateMinutes();

    return hourlyRate * minutes / 60;
}


function updateCalculation() {

    const minutes =
        calculateMinutes();

    const pay =
        calculatePay();

    document.getElementById("workHours")
        .textContent =
        formatMinutes(minutes);

    document.getElementById("workPay")
        .textContent =
        "$" + Math.round(pay).toLocaleString();
}


document
    .getElementById("hourlyRate")
    .addEventListener(
        "input",
        updateCalculation
    );

document
    .getElementById("startTime")
    .addEventListener(
        "input",
        updateCalculation
    );

document
    .getElementById("endTime")
    .addEventListener(
        "input",
        updateCalculation
    );


/* =========================
   新增一筆
========================= */

function addRecord() {

    const hourlyRate =
        Number(
            document.getElementById("hourlyRate").value
        );

    const date =
        document.getElementById("workDate").value;

    const startTime =
        document.getElementById("startTime").value;

    const endTime =
        document.getElementById("endTime").value;

    const actualPay =
        Number(
            document.getElementById("actualPay").value
        ) || 0;


    if (!hourlyRate) {

        alert("請輸入時薪");

        return;
    }

    if (!date) {

        alert("請選擇日期");

        return;
    }

    if (!startTime || !endTime) {

        alert("請輸入上班與下班時間");

        return;
    }


    const minutes =
        calculateMinutes();

    if (minutes <= 0) {

        alert("工作時間必須大於 0 分鐘");

        return;
    }


    const pay =
        hourlyRate * minutes / 60;


    const record = {

        id:
            Date.now().toString(),

        hourlyRate:

            hourlyRate,

        date:

            date,

        startTime:

            startTime,

        endTime:

            endTime,

        minutes:

            minutes,

        pay:

            Math.round(pay),

        actualPay:

            actualPay

    };


    data.records.push(record);

    saveData();

    clearInputs();

    renderAll();

    alert("已新增這筆資料");
}


/* =========================
   清除輸入
========================= */

function clearInputs() {

    document.getElementById(
        "startTime"
    ).value = "";

    document.getElementById(
        "endTime"
    ).value = "";

    document.getElementById(
        "actualPay"
    ).value = "";

    updateCalculation();
}


/* =========================
   刪除單筆
========================= */

function deleteRecord(id) {

    const record =
        data.records.find(
            item => item.id === id
        );

    if (!record) {
        return;
    }


    const ok =
        confirm(
            `確定要刪除 ${record.date} 這筆資料嗎？`
        );

    if (!ok) {
        return;
    }


    data.records =
        data.records.filter(
            item => item.id !== id
        );


    saveData();

    renderAll();
}


/* =========================
   月份工具
========================= */

function getMonth(date) {

    return date.substring(0, 7);
}


function formatMonth(month) {

    const parts =
        month.split("-");

    return `${parts[0]} 年 ${Number(parts[1])} 月`;
}


/* =========================
   目前月份
========================= */

function getCurrentSelectedMonth() {

    const date =
        document.getElementById(
            "workDate"
        ).value;

    if (!date) {

        const now = new Date();

        return `${now.getFullYear()}-${String(
            now.getMonth() + 1
        ).padStart(2, "0")}`;

    }

    return getMonth(date);
}


/* =========================
   取得月份資料
========================= */

function getMonthRecords(month) {

    return data.records.filter(
        record =>
            getMonth(record.date) === month
    );
}


/* =========================
   統計月份
========================= */

function calculateMonth(month) {

    const records =
        getMonthRecords(month);


    let totalMinutes = 0;

    let totalPay = 0;

    let totalActual = 0;


    records.forEach(record => {

        totalMinutes +=
            Number(record.minutes) || 0;

        totalPay +=
            Number(record.pay) || 0;

        totalActual +=
            Number(record.actualPay) || 0;

    });


    return {

        records,

        totalMinutes,

        totalPay,

        totalActual

    };
}


/* =========================
   顯示本月
========================= */

function renderCurrentMonth() {

    const month =
        getCurrentSelectedMonth();

    const result =
        calculateMonth(month);


    document.getElementById(
        "monthHours"
    ).textContent =
        formatMinutes(
            result.totalMinutes
        );


    document.getElementById(
        "monthPay"
    ).textContent =
        "$" +
        Math.round(
            result.totalPay
        ).toLocaleString();


    document.getElementById(
        "monthActual"
    ).textContent =
        "$" +
        Math.round(
            result.totalActual
        ).toLocaleString();


    document.getElementById(
        "monthCount"
    ).textContent =
        result.records.length;


    const container =
        document.getElementById(
            "currentRecords"
        );


    if (result.records.length === 0) {

        container.innerHTML =
            `<div class="empty">
                本月目前沒有工作紀錄
             </div>`;

        return;
    }


    /*
       日期由新到舊
    */

    const records =
        [...result.records].sort(
            (a, b) =>
                b.date.localeCompare(a.date)
        );


    container.innerHTML =
        records.map(
            record => `

            <div class="record">

                <div class="recordHeader">

                    <div class="recordDate">
                        📅 ${record.date}
                    </div>

                    <button
                        class="deleteBtn"
                        onclick="deleteRecord('${record.id}')"
                    >
                        🗑️ 刪除這筆
                    </button>

                </div>

                <div>
                    🕐 ${record.startTime}
                    ～ ${record.endTime}
                </div>

                <div>
                    ⏱️ 工時：
                    ${formatMinutes(record.minutes)}
                </div>

                <div>
                    💰 時薪：
                    $${Number(record.hourlyRate).toLocaleString()}
                </div>

                <div>
                    💵 應得：
                    $${Number(record.pay).toLocaleString()}
                </div>

                <div>
                    💳 實收：
                    $${Number(record.actualPay).toLocaleString()}
                </div>

            </div>
        `
        ).join("");
}


/* =========================
   手動結算
========================= */

function settleCurrentMonth() {

    const month =
        getCurrentSelectedMonth();

    const result =
        calculateMonth(month);


    if (result.records.length === 0) {

        alert("這個月份目前沒有資料，無法結算。");

        return;
    }


    const existing =
        data.settlements.find(
            item => item.month === month
        );


    const settlement = {

        month:

            month,

        totalMinutes:

            result.totalMinutes,

        totalPay:

            result.totalPay,

        totalActual:

            result.totalActual,

        count:

            result.records.length,

        settledAt:

            new Date().toISOString()

    };


    if (existing) {

        const ok =
            confirm(
                `${formatMonth(month)} 已經結算過。\n\n要更新這個月份的結算資料嗎？`
            );

        if (!ok) {
            return;
        }


        data.settlements =
            data.settlements.map(
                item =>
                    item.month === month
                        ? settlement
                        : item
            );

    } else {

        data.settlements.push(
            settlement
        );

    }


    saveData();

    renderAll();

    alert(
        `${formatMonth(month)} 已完成結算！`
    );
}


/* =========================
   刪除月份
========================= */

function deleteMonth(month) {

    const ok =
        confirm(
            `確定要刪除「${formatMonth(month)}」的所有資料嗎？\n\n這個月份的工作紀錄與結算紀錄都會刪除。`
        );


    if (!ok) {
        return;
    }


    data.records =
        data.records.filter(
            record =>
                getMonth(record.date) !== month
        );


    data.settlements =
        data.settlements.filter(
            item =>
                item.month !== month
        );


    saveData();

    renderAll();
}


/* =========================
   每月結算紀錄
========================= */

function renderMonthlyRecords() {

    const container =
        document.getElementById(
            "monthlyRecords"
        );


    if (data.settlements.length === 0) {

        container.innerHTML =
            `<div class="empty">
                尚無已結算的月份
             </div>`;

        return;
    }


    const settlements =
        [...data.settlements].sort(
            (a, b) =>
                b.month.localeCompare(a.month)
        );


    container.innerHTML =
        settlements.map(
            item => `

            <div class="month">

                <div class="monthHeader">

                    <div class="monthTitle">
                        📅 ${formatMonth(item.month)}
                    </div>

                    <button
                        class="deleteMonthBtn"
                        onclick="deleteMonth('${item.month}')"
                    >
                        🗑️ 刪除月份
                    </button>

                </div>

                <div class="monthInfo">

                    ⏱️ 累計工時：
                    <strong>
                        ${formatMinutes(item.totalMinutes)}
                    </strong>

                    <br>

                    💰 應得薪資：
                    <strong>
                        $${Math.round(item.totalPay).toLocaleString()}
                    </strong>

                    <br>

                    💳 實收金額：
                    <strong>
                        $${Math.round(item.totalActual).toLocaleString()}
                    </strong>

                    <br>

                    📝 工作筆數：
                    <strong>
                        ${item.count}
                    </strong>

                </div>

            </div>

        `
        ).join("");
}


/* =========================
   所有畫面重新整理
========================= */

function renderAll() {

    renderCurrentMonth();

    renderMonthlyRecords();

    updateCalculation();
}


/* =========================
   日期改變時更新月份
========================= */

document
    .getElementById("workDate")
    .addEventListener(
        "change",
        renderCurrentMonth
    );


/* =========================
   啟動
========================= */

setDefaultDate();

renderAll();

</script>

</body>
</html>
